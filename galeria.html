<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria de Trabalhos | Nielly Sousa</title>

<link rel="stylesheet" href="galeria.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="container">

    <div class="voltar">

    <button onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
    </button>

</div>

    <header>

        <img src="logo/loogo.jpeg" class="logo">

        <h1>Galeria de Trabalhos</h1>

        <p>Conheça alguns dos nossos atendimentos e transforme sua beleza conosco.</p>

    </header>

    <div class="galeria">

        <div class="foto">
            <img src="galeria/img-1.jpeg" alt="">
            <div class="overlay">
                <h3>Alongamento em Gel</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-11.jpeg" alt="">
            <div class="overlay">
                <h3>Blindagem</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-3.avif" alt="">
            <div class="overlay">
                <h3>Manicure</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-4.jpeg" alt="">
            <div class="overlay">
                <h3>Pedicure</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-10.jpeg" alt="">
            <div class="overlay">
                <h3>Designer de Sobrancelhas</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-6.jpg" alt="">
            <div class="overlay">
                <h3>Henna</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-7.jpeg" alt="">
            <div class="overlay">
                <h3>Esmaltação</h3>
            </div>
        </div>

        <div class="foto">
            <img src="galeria/img-8.jpg" alt="">
            <div class="overlay">
                <h3>Acabamento Premium</h3>
            </div>
        </div>

    </div>

</section>

<div class="lightbox">

    <span class="fechar">&times;</span>

    <img id="imagemGrande">

</div>

<script src="galeria.js"></script>

</body>

</html>
